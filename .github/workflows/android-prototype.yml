name: Android prototype (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unity project prerequisites
        shell: bash
        run: |
          test -f ProjectSettings/ProjectVersion.txt
          test -f Packages/manifest.json
          test -f Assets/Editor/BuildAndGenerate.cs
          test -n "${{ secrets.UNITY_LICENSE }}" || { echo "UNITY_LICENSE secret missing"; exit 1; }
      - name: Generate prototype and build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: EthiopiaLegends.EditorTools.BuildAndGenerate.BuildAndroid
          buildsPath: Builds
          versioning: None
      - name: Upload APK if build succeeded
        uses: actions/upload-artifact@v4
        with:
          name: ethiopia-legends-android-prototype
          path: Builds/Android/*.apk
          if-no-files-found: error
