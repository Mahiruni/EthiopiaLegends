name: Android prototype (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unity project metadata
        shell: bash
        run: |
          test -f ProjectSettings/ProjectVersion.txt || { echo 'Unity project not initialized. Create Unity 6 URP project and commit ProjectSettings and Packages first.'; exit 1; }
          test -f Packages/manifest.json || { echo 'Missing Unity package manifest'; exit 1; }
      - name: Build Android development APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: EthiopiaLegends
          buildsPath: Builds
          versioning: None
      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ethiopia-legends-android-prototype
          path: Builds/Android/
          if-no-files-found: error
